# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none

pool: Default

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '16.x'
  displayName: 'Install Node.js'

- script: |
    cd ReactTodoUIMonolith
    npm install

  displayName: 'npm install'


- script: |
    cd ReactTodoUIMonolith
    npm run build

    echo ===== BUILD FOLDER =====
    dir build
  displayName: 'npm build'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)/ReactTodoUIMonolith/build'
    artifact: 'vivek-todo'
    publishLocation: 'pipeline'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)/ReactTodoUIMonolith/build'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/vivek-todo.zip'
    replaceExistingArchive: true

- task: CopyFilesOverSSH@0
  displayName: 'Copy ZIP to Server'
  inputs:
    sshEndpoint: 'vivek-service-conn-ssh-pair'
    sourceFolder: '$(Build.ArtifactStagingDirectory)'
    contents: 'vivek-todo.zip'
    targetFolder: '/var/www/html/'
    readyTimeout: '20000'


